<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="複数の天気予報を統合し、ソース間のばらつきを比較。">
  <title>天気コンパス — 統合天気予報</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./ui.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="./"><span class="mark" aria-hidden="true">◈</span> 天気コンパス</a>
      <nav aria-label="ページ内メニュー"><a href="#weekly">週間予報</a><a href="#hourly">時間別</a><a href="#accuracy">精度検証</a></nav>
      <button id="theme" class="icon-button" aria-label="配色を切り替え" title="配色を切り替え">◐</button>
    </div>
  </header>
  <main class="wrap">
    <div class="intro">
      <div><p class="kicker"><span></span> 統合天気予報</p><h1><span id="place">東京</span><span id="region"></span></h1><p id="date" class="muted"></p></div>
      <div class="location-controls">
        <form id="search" role="search">
          <label class="sr" for="query">都市名</label>
          <input id="query" type="search" placeholder="都市名を検索" required autocomplete="off">
          <button type="submit">検索</button>
        </form>
        <button id="geo" class="secondary" type="button">◎ 現在地</button>
        <div id="search-results" class="search-results" hidden></div>
      </div>
    </div>
    <div class="statusbar">
      <div id="status" role="status">予報を取得しています…</div>
      <div class="status-actions"><button id="retry" class="plain">再取得</button><button id="mode" class="plain">モックで試す</button></div>
    </div>
    <div id="source-errors" hidden></div>
    <section id="weekly" aria-labelledby="weekly-title">
      <div class="section-head"><div><h2 id="weekly-title">週間予報</h2><p>今日から7日間</p></div><div class="confidence-key"><span class="high">高</span><span class="mid">中</span><span class="low">要注意</span></div></div>
      <div id="days" class="days"></div>
    </section>
    <section id="hourly" aria-labelledby="hourly-title">
      <div class="section-head"><div><h2 id="hourly-title">時間別予報</h2><p>これから48時間 · 統合値と各ソース</p></div></div>
      <div class="panel chart-panel">
        <div id="metrics" class="tabs" aria-label="グラフの指標"></div>
        <div class="plot"><canvas id="chart" aria-label="時間別の統合予報と各ソースの折れ線グラフ" role="img"></canvas></div>
        <div id="legend" class="legend"></div>
        <div class="slider-line"><label for="hour">表示時刻 <strong id="hour-label">—</strong></label><input id="hour" type="range" min="0" max="47" value="0" aria-label="比較する時刻"></div>
        <div id="hour-details" class="hour-details"></div>
      </div>
    </section>
    <section id="comparison" aria-labelledby="comparison-title">
      <div class="section-head"><div><h2 id="comparison-title">ソース別比較</h2><p id="comparison-caption"></p></div><div class="tabs"><button id="compare-hour" aria-pressed="true">時間別</button><button id="compare-day" aria-pressed="false">日別</button></div></div>
      <div class="panel table-wrap"><table id="sources"></table></div>
    </section>
    <section id="accuracy" aria-labelledby="accuracy-title">
      <div class="section-head"><div><h2 id="accuracy-title">予報の精度検証</h2><p>過去7日の降水有無の的中率と平均絶対誤差（MAE）</p></div><button id="verify" class="secondary">検証を更新</button></div>
      <div class="panel accuracy-panel">
        <p id="verification-status" role="status">保存した予報を確認しています…</p>
        <div class="table-wrap"><table id="ranking" hidden></table></div>
        <div class="verification-actions">
          <button id="sample" class="secondary" hidden>モック検証データを追加</button>
          <button id="apply" class="primary" disabled>提案の重みを反映</button>
          <button id="reset" class="plain">設定の重みに戻す</button>
        </div>
        <p class="footnote">照合先は Open-Meteo Historical の再解析データです。提供の遅れにより、直近の日付は未集計の場合があります。</p>
      </div>
    </section>
    <footer>Open-Meteo · MET Norway · 気象庁 <span>信頼度はソース間の一致度の目安です。</span></footer>
  </main>
</body>
</html>
